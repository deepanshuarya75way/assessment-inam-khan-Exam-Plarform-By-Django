<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Proctored Exam System{% endblock %}</title>
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #ec4899;
            --accent: #06b6d4;
            --success: #10b981;
            --success-dark: #059669;
            --warning: #f59e0b;
            --danger: #ef4444;
            --danger-dark: #dc2626;
            --dark: #0f172a;
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-700: #334155;
            --slate-600: #475569;
            --slate-500: #64748b;
            --slate-400: #94a3b8;
            --slate-300: #cbd5e1;
            --slate-200: #e2e8f0;
            --slate-100: #f1f5f9;
            --slate-50: #f8fafc;
            --gradient-primary: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
            --gradient-success: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --gradient-danger: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            --gradient-warm: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
            --shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(15, 23, 42, 0.10), 0 8px 10px -6px rgba(15, 23, 42, 0.06);
            --shadow-xl: 0 25px 50px -12px rgba(15, 23, 42, 0.18);
            --shadow-glow: 0 0 0 1px rgba(99, 102, 241, 0.05), 0 8px 24px rgba(99, 102, 241, 0.18);
            --radius-sm: 6px;
            --radius: 10px;
            --radius-md: 14px;
            --radius-lg: 18px;
            --radius-xl: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        *::selection { background: rgba(99, 102, 241, 0.25); color: var(--slate-900); }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            color: var(--slate-800);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #eef1ff;
            background-image:
                radial-gradient(at 12% 8%, rgba(99, 102, 241, 0.22) 0, transparent 45%),
                radial-gradient(at 88% 14%, rgba(236, 72, 153, 0.18) 0, transparent 42%),
                radial-gradient(at 78% 90%, rgba(6, 182, 212, 0.20) 0, transparent 45%),
                radial-gradient(at 18% 88%, rgba(139, 92, 246, 0.18) 0, transparent 45%);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(15, 23, 42, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(15, 23, 42, 0.025) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        h1, h2, h3, h4, h5 {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            color: var(--slate-900);
            letter-spacing: -0.02em;
            line-height: 1.25;
        }

        /* ───── Navbar ───── */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(15, 23, 42, 0.06);
            padding: 0.85rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav h1 {
            font-size: 1.15rem;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        nav h1::before {
            content: '';
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--gradient-primary);
            -webkit-text-fill-color: white;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
        }
        nav .nav-links { display: flex; gap: 0.5rem; align-items: center; }
        nav .nav-links span {
            color: var(--slate-600);
            font-size: 0.875rem;
            margin-right: 0.5rem;
            font-weight: 500;
        }
        nav a {
            color: var(--slate-700);
            text-decoration: none;
            padding: 0.5rem 0.95rem;
            border-radius: var(--radius-sm);
            transition: all 0.2s ease;
            font-size: 0.875rem;
            font-weight: 500;
        }
        nav a:hover {
            background: rgba(99, 102, 241, 0.10);
            color: var(--primary-dark);
            transform: translateY(-1px);
        }
        nav form button {
            font-family: inherit;
            transition: all 0.2s ease;
        }
        nav form button:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(239, 68, 68, 0.35); }

        /* ───── Layout ───── */
        .container {
            position: relative;
            z-index: 1;
            flex: 1;
            padding: 2.5rem 2rem;
            max-width: 1240px;
            margin: 0 auto;
            width: 100%;
            animation: fadeUp 0.5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ───── Cards ───── */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-md);
            margin-bottom: 1.25rem;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .card:hover { box-shadow: var(--shadow-lg); }
        .card h2 { color: var(--slate-900); margin-bottom: 1.25rem; font-size: 1.5rem; font-weight: 700; }
        .card h3 { color: var(--slate-800); margin-bottom: 0.85rem; font-size: 1.15rem; font-weight: 700; }

        /* ───── Buttons ───── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.8rem 1.5rem;
            background: var(--gradient-primary);
            color: white;
            text-decoration: none;
            border-radius: var(--radius);
            border: none;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.32);
            letter-spacing: 0.01em;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 40%);
            pointer-events: none;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(99, 102, 241, 0.42); filter: brightness(1.05); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

        .btn-secondary {
            background: white;
            color: var(--slate-700);
            border: 1px solid var(--slate-200);
            box-shadow: var(--shadow-sm);
        }
        .btn-secondary:hover { background: var(--slate-50); color: var(--slate-900); box-shadow: var(--shadow); }

        .btn-danger { background: var(--gradient-danger); box-shadow: 0 4px 14px rgba(239, 68, 68, 0.32); }
        .btn-danger:hover { box-shadow: 0 10px 24px rgba(239, 68, 68, 0.42); }

        .btn-success { background: var(--gradient-success); box-shadow: 0 4px 14px rgba(16, 185, 129, 0.32); }
        .btn-success:hover { box-shadow: 0 10px 24px rgba(16, 185, 129, 0.42); }

        /* ───── Messages ───── */
        .error-msg, .success-msg {
            padding: 0.9rem 1.1rem;
            border-radius: var(--radius);
            margin-bottom: 1rem;
            font-size: 0.92rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            animation: fadeUp 0.35s ease both;
        }
        .error-msg {
            color: #b91c1c;
            background: linear-gradient(135deg, #fef2f2, #fee2e2);
            border: 1px solid #fecaca;
        }
        .error-msg::before { content: '⚠'; font-size: 1.1rem; }
        .success-msg {
            color: #047857;
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            border: 1px solid #a7f3d0;
        }
        .success-msg::before { content: '✓'; font-size: 1.1rem; font-weight: bold; }

        /* ───── Forms ───── */
        .form-group { margin-bottom: 1.15rem; }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--slate-700);
            font-size: 0.875rem;
            letter-spacing: 0.01em;
        }
        input[type="text"], input[type="email"], input[type="password"],
        input[type="number"], input[type="datetime-local"], select, textarea {
            width: 100%;
            padding: 0.75rem 0.95rem;
            border: 1.5px solid var(--slate-200);
            border-radius: var(--radius);
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--slate-900);
            background: white;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }
        input::placeholder, textarea::placeholder { color: var(--slate-400); }
        textarea { resize: vertical; min-height: 110px; line-height: 1.55; }
        input:hover, select:hover, textarea:hover { border-color: var(--slate-300); }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            background: white;
        }
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.85rem center;
            background-size: 16px;
            padding-right: 2.5rem;
        }

        /* ───── Tables ───── */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 1rem;
            background: white;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        th, td {
            padding: 0.85rem 1.1rem;
            text-align: left;
            border-bottom: 1px solid var(--slate-100);
        }
        th {
            background: var(--slate-50);
            font-weight: 700;
            color: var(--slate-700);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        tr:last-child td { border-bottom: none; }
        tbody tr { transition: background 0.15s ease; }
        tbody tr:hover { background: var(--slate-50); }

        /* ───── Badges ───── */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }
        .badge-success { background: linear-gradient(135deg, #d1fae5, #a7f3d0); color: #065f46; }
        .badge-warning { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; }
        .badge-danger  { background: linear-gradient(135deg, #fee2e2, #fecaca); color: #991b1b; }
        .badge-info    { background: linear-gradient(135deg, #dbeafe, #bfdbfe); color: #1e40af; }

        hr { border: none; border-top: 1px solid var(--slate-200); margin: 1.5rem 0; }

        a { color: var(--primary-dark); }
        a:hover { color: var(--primary); }

        /* ───── Scrollbar ───── */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--slate-300); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
        ::-webkit-scrollbar-thumb:hover { background: var(--slate-400); background-clip: padding-box; border: 2px solid transparent; }

        @media (max-width: 640px) {
            nav { padding: 0.75rem 1rem; flex-wrap: wrap; gap: 0.5rem; }
            nav h1 { font-size: 1rem; }
            .container { padding: 1.5rem 1rem; }
            .card { padding: 1.25rem; border-radius: var(--radius-md); }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav>
        <h1>Proctored Exam System</h1>
        <div class="nav-links">
            {% if user.is_authenticated %}
                <span>Hi, <strong style="color:var(--slate-800);">{{ user.username }}</strong></span>
                <a href="{% url 'dashboard' %}">Dashboard</a>
                <a href="{% url 'profile' %}" style="background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; box-shadow:0 4px 12px rgba(99,102,241,0.30);">Profile</a>
                <form method="post" action="{% url 'logout' %}" style="display:inline; margin:0;">
                    {% csrf_token %}
                    <button type="submit" style="background:linear-gradient(135deg,#ef4444,#dc2626); color:#fff; border:none; padding:0.5rem 1rem; border-radius:8px; cursor:pointer; font-size:0.875rem; font-weight:600; box-shadow:0 4px 12px rgba(239,68,68,0.28);">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}" style="background:linear-gradient(135deg,#10b981,#059669); color:#fff; box-shadow:0 4px 12px rgba(16,185,129,0.30);">Sign Up</a>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <a href="https://www.linkedin.com/in/inam-khan1/" target="_blank" rel="noopener noreferrer" class="author-badge" aria-label="Made by Inam Khan — LinkedIn">
        <span class="ab-avatar">IK</span>
        <span class="ab-text">
            <span class="ab-line1">BEST WISHES</span>
            <span class="ab-line2">BY OUR TEAM</span>
        </span>
        <svg class="ab-li" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/>
        </svg>
    </a>

    <style>
        .author-badge {
            position: fixed;
            right: 1.25rem;
            bottom: 1.25rem;
            z-index: 9999;
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.55rem 0.95rem 0.55rem 0.55rem;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(99, 102, 241, 0.22);
            border-radius: 999px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12), 0 2px 6px rgba(99, 102, 241, 0.10);
            text-decoration: none;
            color: var(--slate-800);
            font-family: 'Inter', sans-serif;
            transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
            animation: ab-in 0.5s ease both 0.3s;
        }
        .author-badge:hover {
            transform: translateY(-3px);
            color: var(--slate-900);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 16px 38px rgba(99, 102, 241, 0.28), 0 4px 10px rgba(15, 23, 42, 0.10);
        }
        .author-badge .ab-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--gradient-primary);
            color: #fff;
            font-weight: 800;
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.4);
            flex-shrink: 0;
        }
        .author-badge .ab-text {
            display: flex;
            flex-direction: column;
            line-height: 1.05;
        }
        .author-badge .ab-line1 {
            font-size: 0.66rem;
            font-weight: 600;
            color: var(--slate-500);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .author-badge .ab-line2 {
            font-size: 0.92rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .author-badge .ab-li {
            width: 18px;
            height: 18px;
            color: #0a66c2;
            flex-shrink: 0;
        }
        @keyframes ab-in {
            from { opacity: 0; transform: translateY(14px) scale(0.92); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        @media (max-width: 640px) {
            .author-badge { right: 0.75rem; bottom: 0.75rem; padding: 0.45rem 0.8rem 0.45rem 0.45rem; }
            .author-badge .ab-avatar { width: 28px; height: 28px; font-size: 0.72rem; }
            .author-badge .ab-line2 { font-size: 0.85rem; }
        }
    </style>
</body>
</html>
